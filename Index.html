 * VIRAL CONTENT ENGINE - BASE STYLES 
 * Modern Dark Theme / Mobile-First
 */

:root {
    --bg: #050505;
    --surface: #0d0d0d;
    --border: #1a1a1a;
    --accent: #ff0000;
    --accent-glow: #ff000033;
    --text: #ffffff;
    --text-dim: #888888;
    --success: #00cc66;
    --warning: #ffcc00;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    overflow-x: hidden;
}

/* Header */
header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(5, 5, 5, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-icon {
    font-size: 24px;
    filter: drop-shadow(0 0 5px var(--accent));
}

.header-title {
    font-family: Impact, sans-serif;
    font-size: 18px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.header-sub {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
}

/* Navigation Tabs */
.nav-tabs {
    display: flex;
    overflow-x: auto;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
}

.nav-tabs::-webkit-scrollbar { display: none; }

.tab-btn {
    flex: 0 0 auto;
    padding: 14px 20px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
}

.tab-btn.active {
    color: var(--text);
    border-bottom-color: var(--accent);
    background: rgba(255, 0, 0, 0.05);
}

/* Content Area */
#tabContent {
    padding: 16px;
    padding-bottom: 80px; /* Space for bottom elements */
}

/* Buttons */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}

.btn:active { transform: scale(0.98); }

.btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}

.btn-success {
    background: var(--success);
    border-color: var(--success);
}

.btn-outline {
    background: transparent;
    border-color: var(--border);
}

.btn-block { width: 100%; }

/* Inputs */
.input-group { margin-bottom: 16px; }
.input-label { display: block; font-size: 10px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 1px; }
input, textarea, select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px;
    color: var(--text);
    font-size: 14px;
}
input:focus { border-color: var(--accent); outline: none; }

/* Cards */
.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
}

/* Analytics & Progress */
.progress-container {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin: 10px 0;
}
.progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s;
}

/* Utility */
.flex { display: flex; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-8 { gap: 8px; }
.mt-16 { margin-top: 16px; }
.text-accent { color: var(--accent); }
.text-dim { color: var(--text-dim); }

/* Copy Feedback */
.copied-toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--success);
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    z-index: 2000;
    animation: slideUp 0.3s ease-out;
}

@keyframes slideUp {
    from { transform: translate(-50%, 20px); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
}

/**
 * STORAGE SERVICE (IndexedDB)
 * Replaces localStorage for larger data limits and persistence of Blobs (audio/images).
 * This ensures audio files don't break after page refresh.
 */
window.Store = (function() {
    const DB_NAME = 'ViralContentEngineDB';
    const DB_VERSION = 1;
    let db = null;

    const init = () => {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onerror = () => reject('Database failed to open');
            request.onsuccess = (e) => {
                db = e.target.result;
                resolve(db);
            };
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings');
                if (!db.objectStoreNames.contains('scripts')) db.createObjectStore('scripts', { keyPath: 'id' });
                if (!db.objectStoreNames.contains('bank')) db.createObjectStore('bank', { keyPath: 'id' });
                if (!db.objectStoreNames.contains('analytics')) db.createObjectStore('analytics');
            };
        });
    };

    const get = (storeName, key) => {
        return new Promise((resolve) => {
            const transaction = db.transaction([storeName], 'readonly');
            const store = transaction.objectStore(storeName);
            const request = store.get(key);
            request.onsuccess = () => resolve(request.result);
        });
    };

    const set = (storeName, key, value) => {
        return new Promise((resolve) => {
            const transaction = db.transaction([storeName], 'readwrite');
            const store = transaction.objectStore(storeName);
            store.put(value, key);
            transaction.oncomplete = () => resolve(true);
        });
    };

    const getAll = (storeName) => {
        return new Promise((resolve) => {
            const transaction = db.transaction([storeName], 'readonly');
            const store = transaction.objectStore(storeName);
            const request = store.getAll();
            request.onsuccess = () => resolve(request.result);
        });
    };

    const remove = (storeName, key) => {
        return new Promise((resolve) => {
            const transaction = db.transaction([storeName], 'readwrite');
            const store = transaction.objectStore(storeName);
            store.delete(key);
            transaction.oncomplete = () => resolve(true);
        });
    };

    const clear = (storeName) => {
        return new Promise((resolve) => {
            const transaction = db.transaction([storeName], 'readwrite');
            const store = transaction.objectStore(storeName);
            store.clear();
            transaction.oncomplete = () => resolve(true);
        });
    };

    return {
        init,
        // Settings
        getSetting: (key) => get('settings', key),
        setSetting: (key, val) => set('settings', key, val),
        // Scripts
        getScripts: () => getAll('scripts'),
        addScript: (script) => set('scripts', script.id, script),
        removeScript: (id) => remove('scripts', id),
        clearScripts: () => clear('scripts'),
        // Bank (The Packages)
        getBank: () => getAll('bank'),
        addToBank: (item) => set('bank', item.id, item),
        removeFromBank: (id) => remove('bank', id),
        // Analytics
        getAnalytics: (key) => get('analytics', key),
        setAnalytics: (key, val) => set('analytics', key, val),
        // Reset everything
        resetAll: async () => {
            await clear('settings');
            await clear('scripts');
            await clear('bank');
            await clear('analytics');
            location.reload();
        }
    };
})();

// --- js/services/api.js ---
/**
 * API SERVICE
 * Proxies all requests through the Cloudflare Worker.
 */
window.Api = (function() {
    const callWorker = async (route, body) => {
        if (!window.WORKER_URL) {
            throw new Error('Worker URL not set in Settings!');
        }
        
        const response = await fetch(`${window.WORKER_URL}${route}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (!response.ok) {
            throw new Error(`Worker Error: ${response.statusText}`);
        }

        return await response.json();
    };

    return {
        generateScripts: (params) => callWorker('/ai', params),
        generateTTS: async (text, voice) => {
            // For TTS, we might return a Blob directly if the worker proxies it
            const response = await fetch(`${window.WORKER_URL}/tts`, {
                method: 'POST',
                body: JSON.stringify({ text, voice })
            });
            return await response.blob();
        },
        searchPexels: (query) => callWorker('/pexels', { query }),
        fetchYouTubeStats: (id) => callWorker('/youtube-stats', { id })
    };
})();

// --- js/services/copy.js ---
/**
 * COPY SERVICE
 * Reliable clipboard handling for mobile PWA.
 */
window.Copy = (function() {
    const toClipboard = async (text) => {
        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
            } else {
                // Fallback for non-secure or older browsers
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                textArea.style.top = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                document.execCommand('copy');
                textArea.remove();
            }
            showToast('COPIED!');
            return true;
        } catch (err) {
            console.error('Copy failed', err);
            showToast('FAILED', true);
            return false;
        }
    };

    const showToast = (msg, isError = false) => {
        const toast = document.createElement('div');
        toast.className = 'copied-toast';
        if (isError) toast.style.background = '#ff4444';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    };

    return { toClipboard };
})();

// --- js/services/analytics.js ---
/**
 * ANALYTICS SERVICE
 * Handles performance tracking and context generation for the AI.
 */
window.Analytics = (function() {
    const getPerformanceContext = async () => {
        const stats = await Store.getAnalytics('performance') || {};
        const niches = await Store.getAnalytics('niche_scores') || {};
        
        // Generate a summary for the AI
        let summary = "Current performance trends: ";
        if (Object.keys(niches).length === 0) {
            summary += "No data yet, prioritize broad viral hooks.";
        } else {
            // Find top niche
            const topNiche = Object.entries(niches).sort((a,b) => b[1] - a[1])[0];
            summary += `Top performing niche is ${topNiche[0]} with score ${topNiche[1]}. Double down on this style.`;
        }
        
        return summary;
    };

    const registerResult = async (niche, views, likes) => {
        const scores = await Store.getAnalytics('niche_scores') || {};
        const currentScore = scores[niche] || 50;
        
        // Simple moving average / decay
        const newScore = (currentScore * 0.7) + ((views / 100) * 0.3);
        scores[niche] = Math.min(Math.round(newScore), 100);
        
        await Store.setAnalytics('niche_scores', scores);
    };

    return { getPerformanceContext, registerResult };
})();

// --- js/services/autopick.js ---
/**
 * AUTOPICK SERVICE
 * Smart selection of niches and affiliates.
 */
window.AutoPick = (function() {
    const pickNiche = async () => {
        const scores = await Store.getAnalytics('niche_scores') || {};
        const customNiches = await Store.getSetting('custom_niches') || [];
        const allNiches = [...window.NICHES, ...customNiches];

        // 20% Exploration: Pick random
        if (Math.random() < 0.2 || Object.keys(scores).length === 0) {
            return allNiches[Math.floor(Math.random() * allNiches.length)];
        }

        // 80% Optimization: Pick highest score
        const sorted = allNiches.sort((a, b) => {
            const scoreA = scores[a.label] || 0;
            const scoreB = scores[b.label] || 0;
            return scoreB - scoreA;
        });

        return sorted[0];
    };

    return { pickNiche };
})();

            const blob = await Api.generateTTS(script.tts_script, script.voice || 'Brian');

            script.audioGenerated = true;
            await Store.addScript(script);
            btn.innerText = '✅ DONE';

            alert('Audio failed: ' + err.message);
            btn.innerText = '🎙️ RETRY';
        }

    const generateThumb = async (id) => {
        const script = await Store.get('scripts', id);
        const prompt = encodeURIComponent(script.thumbnail_prompt);
        const url = `https://pollinations.ai/p/${prompt}?width=1080&height=1920&seed=${Math.floor(Math.random()*1000)}&nologo=true`;
        
        script.thumbnail_url = url;
        script.thumbGenerated = true;
        await Store.addScript(script);

        const script = await Store.get('scripts', id);
        const container = document.getElementById(`footage-${id}`);
        container.innerHTML = '<div class="text-dim">Searching Pexels...</div>';

            // Pexels search for each prompt
            const results = await Api.searchPexels(script.pexels_prompts[0]);

    const moveToBank = async (id) => {
        const script = await Store.get('scripts', id);
        const bankItem = {
            id: Date.now().toString(),
            ...script,
            timestamp: Date.now()
        };
        await Store.addToBank(bankItem);
        await Store.removeScript(id);
        window.App.refreshCurrentTab();
    };

    const remove = async (id) => {
        if (confirm('Delete this script?')) {
            await Store.removeScript(id);
            window.App.refreshCurrentTab();

    };

    return { render, generateAudio, generateThumb, searchFootage, moveToBank, remove };
})();

/**
 * AUTO MODE COMPONENT
 * Orchestrates batch generation of audio, thumbnails, and footage.
 * Uses Screen Wake Lock API to prevent phone from sleeping.
 */
window.AutoMode = (function() {
    let wakeLock = null;

    const requestWakeLock = async () => {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log('Wake Lock active');
            }
        } catch (err) {
            console.error(`${err.name}, ${err.message}`);
        }
    };

    const releaseWakeLock = async () => {
        if (wakeLock !== null) {
            await wakeLock.release();
            wakeLock = null;
            console.log('Wake Lock released');
        }
    };

    const runBatch = async (scripts) => {
        await requestWakeLock();
        
        const progress = document.createElement('div');
        progress.className = 'automode-panel';
        progress.innerHTML = `
            <div class="automode-header">
                <div class="automode-icon">⚡</div>
                <div>
                    <div class="automode-title">AUTO-PILOT ACTIVE</div>
                    <div class="automode-sub">Processing ${scripts.length} scripts...</div>
                </div>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="auto-progress"></div>
            </div>
            <div id="auto-status" class="auto-step-label">Initializing...</div>
        `;
        
        document.getElementById('tabContent').prepend(progress);

        for (let i = 0; i < scripts.length; i++) {
            const script = scripts[i];
            const percent = ((i + 1) / scripts.length) * 100;
            document.getElementById('auto-progress').style.width = `${percent}%`;
            document.getElementById('auto-status').innerText = `Processing: ${script.title}`;

            try {
                // 1. Generate Audio
                const audioBlob = await window.Api.generateTTS(script.tts_script, script.voice);
                
                // 2. Add to Bank
                const bankItem = {
                    id: Date.now() + Math.random().toString(36).substr(2, 9),
                    scriptId: script.id,
                    title: script.title,
                    niche: script.niche,
                    affiliate: script.affiliate,
                    script: script.tts_script,
                    captions: script.tiktok_caption,
                    tags: script.tags,
                    audioBlob: audioBlob,
                    thumbnail: script.thumbnail_url,
                    timestamp: Date.now()
                };

                // 3. Optional Stitching
                const enableStitcher = await Store.getSetting('enable_stitcher');
                if (enableStitcher) {
                    document.getElementById('auto-status').innerText = `Rendering Video: ${script.title}`;
                    await window.Stitcher.stitch(bankItem);
                }

                await Store.addToBank(bankItem);
                console.log(`Saved ${script.title} to bank.`);

            } catch (err) {
                console.error(`Error processing ${script.title}`, err);
                const errorDiv = document.createElement('div');
                errorDiv.className = 'auto-error';
                errorDiv.innerHTML = `<div class="auto-error-msg">Failed: ${script.title} - ${err.message}</div>`;
                progress.appendChild(errorDiv);
            }
        }

        document.getElementById('auto-status').innerText = 'Batch Complete! Check the BANK tab.';
        await releaseWakeLock();
    };

    return { runBatch };
})();

            </div>

            <div id="scripts-container">
                ${scripts.reverse().map(s => `<div id="script-wrapper-${s.id}"></div>`).join('')}
            </div>
        `;

        scripts.forEach(s => {
            window.ScriptCard.render(document.getElementById(`script-wrapper-${s.id}`), s);

            const btn = container.querySelector('#start-gen');

            btn.disabled = true;

                const performanceContext = await Analytics.getPerformanceContext();
                const trend = document.getElementById('gen-trend').value.trim();

                    const script = {
                        id: Date.now() + Math.random().toString(36).substr(2, 9),
                        ...scriptData,
                        niche: niche.label,
                        status: 'pending',
                        timestamp: Date.now()

                    await Store.addScript(script);

                render(container); // Refresh
            } catch (err) {

            } finally {
                btn.disabled = false;
                btn.innerText = 'GENERATE BATCH';
            }
        };

        container.querySelector('#run-auto-all').onclick = async () => {
            const scripts = await Store.getScripts();
            if (scripts.length === 0) return alert('No scripts to process!');
            await AutoMode.runBatch(scripts);
            render(container);
        };
    };

    return { render };
})();

            if (confirm('Clear all items from the bank?')) {

            }
        };
    };

    const renderBankItem = (item) => {
        const date = new Date(item.timestamp).toLocaleDateString();
        return `
            <div class="card" id="bank-item-${item.id}">
                <div class="flex justify-between items-start">
                    <div style="flex:1;">
                        <div style="font-weight:bold; font-size:14px; margin-bottom:4px;">${item.title}</div>
                        <div class="text-dim" style="font-size:10px;">${item.niche} • ${date}</div>
                    </div>
                    <button class="btn btn-outline" onclick="AssemblerTab.removeItem('${item.id}')" style="padding:4px 8px;">✕</button>
                </div>

                <div class="mt-16 flex gap-8">
                    ${item.thumbnail ? `<img src="${item.thumbnail}" style="width:80px; height:80px; object-fit:cover; border-radius:4px; border:1px solid var(--border);">` : ''}
                    <div style="flex:1;">
                        <div class="text-dim" style="font-size:11px; margin-bottom:8px;">PACKAGE CONTENTS:</div>
                        <div style="font-size:12px;">
                            ✅ Audio Voiceover<br>
                            ✅ ${item.footageCount || 0} Stock Clips<br>
                            ✅ Viral Script & Tags
                        </div>
                    </div>
                </div>

                <div class="mt-16 flex gap-8">
                    <button class="btn btn-primary flex-1" onclick="AssemblerTab.downloadPackage('${item.id}')">📥 DOWNLOAD PKG</button>
                    <button class="btn btn-outline" onclick="AssemblerTab.markPosted('${item.id}')">✅ POSTED</button>
                </div>
            </div>
        `;
    };

    const downloadPackage = async (id) => {
        const item = await Store.get('bank', id);
        if (!item) return;

        // In a real PWA, we'd bundle these into a ZIP or a folder.
        // For now, we'll create a text manifest and trigger downloads for key assets.
        
        const manifest = `
VIRAL CONTENT ENGINE - CONTENT PACKAGE
Title: ${item.title}
Niche: ${item.niche}
Affiliate: ${item.affiliate}

--- SCRIPT ---
${item.script}

--- CAPTIONS ---
${item.captions}

--- TAGS ---
${item.tags}

--- MICROSOFT DESIGNER CONTEXT ---
${item.designer_context || 'N/A'}
        `;

        const blob = new Blob([manifest], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${item.title.replace(/\s+/g, '_')}_manifest.txt`;
        a.click();

        // If we have a stored audio blob, download it
        if (item.audioBlob) {
            const audioUrl = URL.createObjectURL(item.audioBlob);
            const audioA = document.createElement('a');
            audioA.href = audioUrl;
            audioA.download = `${item.title.replace(/\s+/g, '_')}_audio.mp3`;
            audioA.click();
        }

        alert('Package manifest and audio downloaded! Please download footage manually from the search results in the script card.');
    };

    const removeItem = async (id) => {
        if (confirm('Remove this item?')) {
            await Store.removeFromBank(id);
            window.App.refreshCurrentTab();
        }
    };

    const markPosted = async (id) => {
        // Future: Register in analytics
        alert('Marked as posted! (Analytics integration coming soon)');
        await Store.removeFromBank(id);
        window.App.refreshCurrentTab();
    };

    return { render, downloadPackage, removeItem, markPosted };
})();

                <div class="modal-title" style="color: #ff4444;">🚨 DANGER ZONE</div>
                <button class="btn btn-outline btn-block mt-16" id="clear-scripts">CLEAR ALL SCRIPTS</button>
                <button class="btn btn-outline btn-block mt-16" id="full-reset" style="color: #ff4444; border-color: #440000;">FULL APP RESET</button>
            </div>
        `;

        // Event Listeners
        container.querySelector('#save-settings').onclick = async () => {
            const url = document.getElementById('worker-url').value.trim();
            await Store.setSetting('vce_worker_url', url);
            window.WORKER_URL = url;
            alert('Settings saved!');
        };

        container.querySelector('#toggle-stitcher').onchange = async (e) => {
            await Store.setSetting('enable_stitcher', e.target.checked);
        };

        container.querySelector('#toggle-cleanup').onchange = async (e) => {
            await Store.setSetting('enable_cleanup', e.target.checked);
        };

        container.querySelector('#play-preview').onclick = async () => {
            const voice = document.getElementById('preview-voice').value;
            const btn = document.getElementById('play-preview');
            btn.innerText = '⌛...';
            try {
                const blob = await Api.generateTTS("This is a sample of the " + voice + " voice for your viral content engine.", voice);
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                audio.play();
            } catch (err) {
                alert('Preview failed: ' + err.message);
            } finally {
                btn.innerText = '▶️ LISTEN TO SAMPLE';
            }
        };

        container.querySelector('#add-niche').onclick = async () => {
            const emoji = document.getElementById('new-niche-emoji').value.trim();
            const label = document.getElementById('new-niche-label').value.trim();
            if (emoji && label) {
                const niches = await Store.getSetting('custom_niches') || [];
                niches.push({ emoji, label });
                await Store.setSetting('custom_niches', niches);
                render(container);
            }
        };

        container.querySelector('#add-affiliate').onclick = async () => {
            const name = document.getElementById('new-aff-name').value.trim();
            const url = document.getElementById('new-aff-url').value.trim();
            if (name && url) {
                const affs = await Store.getSetting('custom_affiliates') || [];
                affs.push({ name, url });
                await Store.setSetting('custom_affiliates', affs);
                render(container);
            }
        };

        container.querySelector('#clear-scripts').onclick = async () => {
            if (confirm('Clear all scripts?')) {
                await Store.clearScripts();
                alert('Scripts cleared.');
            }
        };

        container.querySelector('#full-reset').onclick = async () => {
            if (confirm('This will wipe ALL data (scripts, settings, analytics). Are you sure?')) {
                await Store.resetAll();
            }
        };
    };

    const deleteNiche = async (index) => {
        const niches = await Store.getSetting('custom_niches') || [];
        niches.splice(index, 1);
        await Store.setSetting('custom_niches', niches);
        window.App.refreshCurrentTab();
    };

    const deleteAffiliate = async (index) => {
        const affs = await Store.getSetting('custom_affiliates') || [];
        affs.splice(index, 1);
        await Store.setSetting('custom_affiliates', affs);
        window.App.refreshCurrentTab();
    };

    return { render, deleteNiche, deleteAffiliate };
})();

// --- js/app.js ---
/**
 * APP SHELL
 * Orchestrates tab routing, initialization, and global state.
 */
window.App = (function() {
    const TABS = [
        { id: 'generator',  label: '⚡ GENERATE',   mod: () => window.GeneratorTab },
        { id: 'analytics',  label: '📊 ANALYTICS',  mod: () => window.AnalyticsTab },
        { id: 'assembler',  label: '📦 BANK',        mod: () => window.AssemblerTab },
        { id: 'affiliates', label: '💰 AFFILIATES',  mod: () => window.AffiliatesTab },
        { id: 'schedule',   label: '📅 SCHEDULE',   mod: () => window.ScheduleTab },
        { id: 'rules',      label: '📋 RULES',       mod: () => window.RulesTab },
        { id: 'settings',   label: '⚙️ SETTINGS',   mod: () => window.SettingsTab },
    ];

    let currentTabId = 'generator';

    const init = async () => {
        console.log('Engine Initializing...');
        
        // Initialize Store (IndexedDB)
        await Store.init();

        // Load Worker URL
        window.WORKER_URL = await Store.getSetting('vce_worker_url');

        // Render Nav
        renderNav();

        // Switch to default tab
        switchTab(currentTabId);

        // Run Auto-Cleanup if enabled
        const enableCleanup = await Store.getSetting('enable_cleanup');
        if (enableCleanup) {
            const bank = await Store.getBank();
            const now = Date.now();
            const sevenDays = 7 * 24 * 60 * 60 * 1000;
            for (const item of bank) {
                if (item.posted && (now - item.timestamp > sevenDays)) {
                    await Store.removeFromBank(item.id);
                }
            }
        }

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
        }

        // Hide loading screen
        setTimeout(() => {
            document.getElementById('app-loading').style.display = 'none';
        }, 500);
    };

    const renderNav = () => {
        const nav = document.getElementById('nav-tabs');
        nav.innerHTML = TABS.map(tab => `
            <button class="tab-btn" data-tab="${tab.id}">${tab.label}</button>
        `).join('');

        nav.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => switchTab(btn.dataset.tab);
        });
    };

    const switchTab = (id) => {
        currentTabId = id;
        
        // Update UI
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tab === id);
        });

        const content = document.getElementById('tabContent');
        content.innerHTML = '<div class="text-dim">Loading tab...</div>';

        const tab = TABS.find(t => t.id === id);
        if (tab && tab.mod()) {
            tab.mod().render(content);
        } else {
            content.innerHTML = `<div class="card">Tab "${id}" is under construction.</div>`;
        }
    };

    const refreshCurrentTab = () => {
        switchTab(currentTabId);
    };

    // Initialize on load
    window.addEventListener('DOMContentLoaded', init);

    return {
        switchTab,
        refreshCurrentTab,
        get currentTabId() { return currentTabId; }
    };
})();
